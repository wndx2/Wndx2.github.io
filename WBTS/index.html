<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- No zooming: pinches and double taps belong to the page, not the browser. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
		<meta name="theme-color" content="#fbfaf7" />
		<!-- Sets the theme before the first paint: the saved choice, or else the iPad's. -->
		<script>
			(function () {
				var saved = null;
				try {
					saved = localStorage.getItem("wbts:theme");
				} catch (e) {}
				var dark = saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
				document.documentElement.dataset.theme = dark ? "dark" : "light";
				document.querySelector('meta[name="theme-color"]').content = dark ? "#000000" : "#fbfaf7";
			})();
		</script>
		<meta name="description" content="WBTS is a scribble pad for iPad and Apple Pencil." />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="WBTS" />
		<!-- Home screen icon: a blackboard-bold W on yellow. -->
		<link rel="apple-touch-icon" href="apple-touch-icon.png" />
		<link rel="icon" type="image/png" href="favicon.png" />
		<link rel="manifest" href="manifest.webmanifest" />
		<title>WBTS</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<main id="board">
			<div id="grid" aria-hidden="true"></div>
			<div id="tiles" role="img" aria-label="Drawing surface"></div>
			<canvas id="live" aria-hidden="true"></canvas>
		</main>

		<nav id="toolbar" aria-label="Tools">
			<div class="group" role="radiogroup" aria-label="Tool">
				<button class="tool" data-tool="pen" aria-label="Pen" aria-pressed="true">
					<svg viewBox="0 0 20 20"><path d="M13.5 3.5l3 3L7 16H4v-3z" /><path d="M11.5 5.5l3 3" /></svg>
				</button>
				<button class="tool" data-tool="highlighter" aria-label="Highlighter" aria-pressed="false">
					<svg viewBox="0 0 20 20"><path d="M12 3.5l4.5 4.5-6 6L6 9.5z" /><path d="M6 9.5L4.5 14l1.5 1.5L10.5 14" /><path d="M3 17.5h5" /></svg>
				</button>
				<button class="tool" data-tool="eraser" aria-label="Eraser" aria-pressed="false">
					<svg viewBox="0 0 20 20"><path d="M8 16.5h8.5" /><path d="M3.8 12.2l7.7-7.7a1.5 1.5 0 012.1 0l2.9 2.9a1.5 1.5 0 010 2.1L10 16H7.6z" /><path d="M7.5 8.5l4 4" /></svg>
				</button>
				<!-- Draw a loop around writing to pick it up, then move, resize, turn or flip it. -->
				<button class="tool" data-tool="lasso" aria-label="Lasso" aria-pressed="false">
					<svg viewBox="0 0 20 20">
						<path d="M10 3.6c3.7 0 6.6 2 6.6 4.4S13.7 12.4 10 12.4 3.4 10.4 3.4 8s3-4.4 6.6-4.4z" stroke-dasharray="2.6 2.3" />
						<path d="M7.8 12.2l-.8 2.2a1.6 1.6 0 101.8 1.1" />
					</svg>
				</button>
			</div>

			<span class="divider" id="div-colours"></span>

			<div class="group swatches picker" data-for="pen" role="radiogroup" aria-label="Pen colour">
				<button class="swatch" data-color="ink" aria-label="Black or white" aria-pressed="true"><span></span></button>
				<button class="swatch" data-color="blue" aria-label="Blue" aria-pressed="false"><span></span></button>
				<button class="swatch" data-color="red" aria-label="Red" aria-pressed="false"><span></span></button>
				<button class="swatch" data-color="green" aria-label="Green" aria-pressed="false"><span></span></button>
				<button class="swatch" data-color="purple" aria-label="Purple" aria-pressed="false"><span></span></button>
				<button class="swatch" data-color="orange" aria-label="Orange" aria-pressed="false"><span></span></button>
			</div>
			<div class="group swatches picker" data-for="highlighter" role="radiogroup" aria-label="Highlighter colour" hidden>
				<button class="swatch" data-color="hl-yellow" aria-label="Yellow" aria-pressed="true"><span></span></button>
				<button class="swatch" data-color="hl-orange" aria-label="Orange" aria-pressed="false"><span></span></button>
				<button class="swatch" data-color="hl-pink" aria-label="Pink" aria-pressed="false"><span></span></button>
				<button class="swatch" data-color="hl-purple" aria-label="Purple" aria-pressed="false"><span></span></button>
				<button class="swatch" data-color="hl-blue" aria-label="Blue" aria-pressed="false"><span></span></button>
				<button class="swatch" data-color="hl-green" aria-label="Green" aria-pressed="false"><span></span></button>
			</div>

			<span class="divider" id="div-sizes"></span>

			<div class="group picker" id="sizes" role="radiogroup" aria-label="Thickness">
				<button class="size" data-size="0" aria-label="Fine" aria-pressed="false"><span></span></button>
				<button class="size" data-size="1" aria-label="Medium" aria-pressed="true"><span></span></button>
				<button class="size" data-size="2" aria-label="Bold" aria-pressed="false"><span></span></button>
			</div>

			<span class="divider"></span>

			<div class="group">
				<button id="undo" aria-label="Undo" disabled>
					<svg viewBox="0 0 20 20"><path d="M7 4L3.5 7.5 7 11" /><path d="M4 7.5h7.5a4.5 4.5 0 010 9H8" /></svg>
				</button>
				<button id="redo" aria-label="Redo" disabled>
					<svg viewBox="0 0 20 20"><path d="M13 4l3.5 3.5L13 11" /><path d="M16 7.5H8.5a4.5 4.5 0 000 9H12" /></svg>
				</button>
				<button id="clear" class="secondary" aria-label="Clear page" disabled>
					<svg viewBox="0 0 20 20"><path d="M4 6h12" /><path d="M8 6V4h4v2" /><path d="M5.5 6l.8 10h7.4l.8-10" /></svg>
				</button>
				<button id="copy" class="secondary" aria-label="Copy as image" aria-haspopup="menu" disabled>
					<svg viewBox="0 0 20 20"><rect x="7" y="7" width="9.5" height="9.5" rx="2" /><path d="M13 4.5A1.5 1.5 0 0011.5 3.5h-6a2 2 0 00-2 2v6A1.5 1.5 0 004.5 13" /></svg>
				</button>
				<button id="paste" class="secondary" aria-label="Paste a picture">
					<svg viewBox="0 0 20 20"><path d="M7.5 4.5h-2A1.5 1.5 0 004 6v9a1.5 1.5 0 001.5 1.5h9A1.5 1.5 0 0016 15V6a1.5 1.5 0 00-1.5-1.5h-2" /><rect x="7.5" y="3" width="5" height="3" rx="1.2" /><path d="M10 9.5v4.5" /><path d="M8 11.5L10 9.5l2 2" /></svg>
				</button>
				<button id="notes" class="secondary" aria-label="Save or open notes with a code" aria-haspopup="menu">
					<svg viewBox="0 0 20 20"><circle cx="7" cy="10" r="3.5" /><path d="M10.5 10H17" /><path d="M14.5 10v2.5" /><path d="M17 10v2" /></svg>
				</button>
			</div>

			<span class="divider"></span>

			<button id="zoom" aria-label="Reset zoom to 100%">100%</button>
			<button id="theme" class="secondary" aria-label="Switch light or dark">
				<!-- Moon shows in light mode, sun in dark mode. -->
				<svg class="moon" viewBox="0 0 20 20"><path d="M16 12.5A6.5 6.5 0 017.5 4a6.5 6.5 0 108.5 8.5z" /></svg>
				<svg class="sun" viewBox="0 0 20 20"><circle cx="10" cy="10" r="3.5" /><path d="M10 2.5v1.5M10 16v1.5M2.5 10H4M16 10h1.5M4.7 4.7l1 1M14.3 14.3l1 1M4.7 15.3l1-1M14.3 5.7l1-1" /></svg>
			</button>
			<!-- In a narrow window (such as Split View) the less-used buttons move in here. -->
			<button id="more" aria-label="More" aria-haspopup="menu">
				<svg viewBox="0 0 20 20"><circle cx="5" cy="10" r="0.6" /><circle cx="10" cy="10" r="0.6" /><circle cx="15" cy="10" r="0.6" /></svg>
			</button>
		</nav>

		<!-- Opens when you tap the pen button while the pen is already selected. -->
		<div id="pen-menu" class="menu" role="menu" aria-label="Pen type" hidden>
			<button data-pen="fountain" role="menuitemradio" aria-checked="true"><canvas></canvas><span>Fountain pen</span></button>
			<button data-pen="ball" role="menuitemradio" aria-checked="false"><canvas></canvas><span>Ball pen</span></button>
			<button data-pen="brush" role="menuitemradio" aria-checked="false"><canvas></canvas><span>Brush pen</span></button>
		</div>

		<!-- Copies the page as a picture, on a light or dark background, whatever the current theme. -->
		<div id="copy-menu" class="menu" role="menu" aria-label="Copy as image" hidden>
			<button data-copy="light" role="menuitem"><span class="chip light"><i></i></span><span>Copy as light</span></button>
			<button data-copy="dark" role="menuitem"><span class="chip dark"><i></i></span><span>Copy as dark</span></button>
		</div>

		<!-- Save notes as a code, or open notes from one. -->
		<div id="notes-menu" class="menu" role="menu" aria-label="Notes code" hidden>
			<button data-notes="save" role="menuitem"><span>Save notes as code</span></button>
			<button data-notes="open" role="menuitem"><span>Open notes from code</span></button>
		</div>

		<dialog id="code-dialog" aria-labelledby="code-title">
			<h2 id="code-title">Notes code</h2>
			<p id="code-note"></p>
			<textarea id="code-text" rows="6" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
			<p id="code-error" aria-live="polite"></p>
			<div class="actions">
				<button id="code-cancel" type="button">Close</button>
				<button id="code-link" class="save-only" type="button">Copy link</button>
				<button id="code-copy" class="save-only primary" type="button">Copy code</button>
				<button id="code-open" class="open-only primary" type="button">Open</button>
			</div>
		</dialog>

		<!-- Sits beside whatever the lasso has picked up. -->
		<div id="sel-bar" role="toolbar" aria-label="Selection" hidden>
			<button data-sel="flip-h" aria-label="Flip left to right">
				<svg viewBox="0 0 20 20"><path d="M10 2.8v14.4" stroke-dasharray="2.2 2.2" /><path d="M7.6 6.4L4.2 10l3.4 3.6z" /><path d="M12.4 6.4L15.8 10l-3.4 3.6z" /></svg>
			</button>
			<button data-sel="flip-v" aria-label="Flip top to bottom">
				<svg viewBox="0 0 20 20"><path d="M2.8 10h14.4" stroke-dasharray="2.2 2.2" /><path d="M6.4 7.6L10 4.2l3.6 3.4z" /><path d="M6.4 12.4L10 15.8l3.6-3.4z" /></svg>
			</button>
			<button data-sel="duplicate" aria-label="Duplicate">
				<svg viewBox="0 0 20 20"><rect x="7.5" y="7.5" width="9" height="9" rx="2" /><path d="M13 4.5A1.5 1.5 0 0011.5 3.5h-6a2 2 0 00-2 2v6A1.5 1.5 0 005 13" /></svg>
			</button>
			<button data-sel="delete" class="danger" aria-label="Delete">
				<svg viewBox="0 0 20 20"><path d="M4 6h12" /><path d="M8 6V4h4v2" /><path d="M5.5 6l.8 10h7.4l.8-10" /></svg>
			</button>
			<button data-sel="done" aria-label="Done">
				<svg viewBox="0 0 20 20"><path d="M4.5 10.5l3.5 3.5 7.5-8" /></svg>
			</button>
		</div>

		<div id="more-menu" class="menu" role="menu" aria-label="More" hidden>
			<button data-more="clear" role="menuitem"><span>Clear page</span></button>
			<button data-more="paste" role="menuitem"><span>Paste picture</span></button>
			<button data-more="copy-light" role="menuitem"><span class="chip light"><i></i></span><span>Copy as light</span></button>
			<button data-more="copy-dark" role="menuitem"><span class="chip dark"><i></i></span><span>Copy as dark</span></button>
			<button data-more="save" role="menuitem"><span>Save notes as code</span></button>
			<button data-more="open" role="menuitem"><span>Open notes from code</span></button>
			<button data-more="theme" role="menuitem"><span>Switch to dark</span></button>
		</div>

		<div id="toast" role="status" aria-live="polite"></div>

		<script src="app.js"></script>
	</body>
</html>
